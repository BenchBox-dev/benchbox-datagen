[workspace]
resolver = "3"
members = ["crates/benchbox-datagen-core", "crates/benchbox-datagen-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BenchBox-dev/benchbox-datagen"

[workspace.dependencies]
arrow = { version = "60", default-features = false }
benchbox-datagen-core = { path = "crates/benchbox-datagen-core" }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pyo3-arrow = "0.21"
thiserror = "2"
tpchgen = "=4.0.0"
tpchgen-arrow = { version = "=4.0.0", default-features = false, features = ["arrow_60"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
