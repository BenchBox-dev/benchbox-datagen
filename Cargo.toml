[workspace]
resolver = "3"
members = ["crates/benchbox-datagen-core", "crates/benchbox-datagen-py", "crates/benchbox-datagen-writers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BenchBox-dev/benchbox-datagen"

[workspace.dependencies]
arrow = { version = "60", default-features = false }
benchbox-datagen-core = { path = "crates/benchbox-datagen-core" }
benchbox-datagen-writers = { path = "crates/benchbox-datagen-writers" }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "flate2-zlib-rs"] }
tempfile = "3"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pyo3-arrow = "0.21"
thiserror = "2"
tpcdsgen = "=4.0.0"
tpcdsgen-arrow = { version = "=4.0.0", default-features = false, features = ["arrow_60"] }
tpchgen = "=4.0.0"
tpchgen-arrow = { version = "=4.0.0", default-features = false, features = ["arrow_60"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[patch.crates-io]
tpcdsgen = { git = "https://github.com/BenchBox-dev/tpcgen-rs", rev = "b4b072b3f3ceb9f2979382beb96b3a27051b57b1" }
tpcdsgen-arrow = { git = "https://github.com/BenchBox-dev/tpcgen-rs", rev = "b4b072b3f3ceb9f2979382beb96b3a27051b57b1" }

[profile.release]
lto = "thin"
codegen-units = 1
