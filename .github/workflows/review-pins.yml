name: review-pins

on:
  pull_request:

permissions:
  contents: read

jobs:
  review-pins:
    name: review pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check the theseus pin is one commit
        run: python3 tools/check_review_pins.py
